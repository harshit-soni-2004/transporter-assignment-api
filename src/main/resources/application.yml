spring:
  application:
    name: transporter-assignment
  datasource:
    url: ${DB_URL:jdbc:h2:mem:transporterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.transporter: DEBUG
